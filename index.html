    rel="stylesheet">

  <!-- Apply dark class immediately before React loads to prevent white flash -->
  <script>
    ;(function () {
      try {
        var saved = localStorage.getItem('theme') || localStorage.getItem('intellix_theme');
        var isDark = saved ? (saved === 'dark') : true;
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light-mode', 'light');
          root.setAttribute('data-theme', 'dark');
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.classList.add('light-mode', 'light');
          root.setAttribute('data-theme', 'light');
          root.style.colorScheme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
